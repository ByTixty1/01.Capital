# Render Blueprint — backend web service (frontend stays on Vercel).
# Deploys backend/ as a Docker service; entrypoint.sh runs Alembic
# migrations then uvicorn. See docs/decisions/0011-render-backend-hosting.md.
services:
  - type: web
    name: 01capital-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    branch: main
    # Frankfurt is Render's closest region to Saudi Arabia. Real customer
    # data still requires Saudi-hosted infra per ADR-0006 — this deployment
    # is for demo/staging use until then.
    region: frankfurt
    # Free tier spins down after ~15 min idle (cold starts re-run
    # migrations). Upgrade to `starter` to keep the service warm.
    plan: free
    # /ping is DB-independent; /health returns 503 when the DB is down,
    # which would put the service in a restart loop.
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: API_PREFIX
        value: /api
      # Comma-separated. Set to the Vercel domain(s), e.g.
      # https://<app>.vercel.app — dashboard prompts on first deploy.
      - key: CORS_ORIGINS
        sync: false
      # Supabase "Session pooler" string (IPv4, port 5432). The app rewrites
      # postgresql:// to postgresql+asyncpg:// automatically.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random value at deploy time.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Must be exactly 64 hex chars (32 bytes) — set manually:
      #   python3 -c "import secrets; print(secrets.token_hex(32))"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Gmail SMTP sender — set SMTP_PASSWORD to a Gmail App Password
      # (myaccount.google.com/apppasswords). SMTP_USER is the sender address.
      - key: SMTP_USER
        value: zeroone.techcompany@gmail.com
      - key: SMTP_PASSWORD
        sync: false
